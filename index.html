<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartoon Shorts Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101322;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;background:#1b2037}
h1{font-size:24px;color:#a8b2ff}
main{max-width:700px;margin:auto;padding:15px}
.card{background:#1b2037;padding:17px;border-radius:13px;margin-bottom:16px}
label{display:block;margin:13px 0 7px}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #485071;background:#101629;color:white}
button{border:0;border-radius:8px;padding:12px;background:#6878ff;color:white;font-weight:bold;margin-top:12px;width:100%;font-size:15px}
button:disabled{opacity:.5}
.note{font-size:13px;color:#c8cce1;line-height:1.6}
video{width:100%;max-height:350px;margin-top:12px;background:#000}
#status{white-space:pre-wrap;padding:12px;background:#101629;border-radius:8px;margin-top:12px}
.clip{background:#101629;padding:12px;border-radius:9px;margin-top:12px;overflow-wrap:anywhere}
.clip a{color:#b6c0ff}
.clip textarea{margin-top:8px}
</style>
</head>
<body>
<header>
<h1>🎬 Cartoon Shorts Maker</h1>
<p>ভিডিও ক্লিপ, টাইটেল ও হ্যাশট্যাগ</p>
</header>

<main>
<section class="card">
<h2>১. ভিডিও নির্বাচন</h2>
<label>ফোন থেকে ভিডিও আপলোড</label>
<input type="file" id="videoFile" accept="video/*">
<video id="preview" controls playsinline hidden></video>

<label>YouTube ভিডিও লিংক</label>
<input type="url" id="youtubeUrl" placeholder="YouTube লিংক এখানে পেস্ট করো">
<p class="note">YouTube লিংক পেস্ট করলে এই সংস্করণে সরাসরি ক্লিপ তৈরি হবে না। তার জন্য আলাদা সার্ভার ও অনুমোদিত ভিডিও অ্যাক্সেস যুক্ত করতে হবে।</p>

<label>প্রতিটি ক্লিপের দৈর্ঘ্য</label>
<select id="duration">
<option value="8">৮ সেকেন্ড</option>
<option value="10" selected>১০ সেকেন্ড</option>
<option value="15">১৫ সেকেন্ড</option>
</select>

<label>কতটি ক্লিপ তৈরি করবে?</label>
<select id="count">
<option value="3">৩টি</option>
<option value="5">৫টি</option>
<option value="7">৭টি</option>
<option value="10" selected>১০টি</option>
</select>

<label>ভিডিওর বিষয় / কীওয়ার্ড</label>
<input id="topic" placeholder="যেমন: Funny Cartoon, Mystery, Cat Story">

<button id="make">✂️ ক্লিপ তৈরি করো</button>
<div id="status">ভিডিও নির্বাচন করো।</div>
<div id="results"></div>
</section>
</main>

<script>
const fileInput=document.getElementById('videoFile');
const video=document.getElementById('preview');
const statusBox=document.getElementById('status');
const results=document.getElementById('results');
const makeButton=document.getElementById('make');

let file=null,videoURL=null,busy=false;

function status(text){statusBox.textContent=text;}

fileInput.addEventListener('change',()=>{
 file=fileInput.files[0];
 results.replaceChildren();
 if(videoURL)URL.revokeObjectURL(videoURL);
 if(!file){video.hidden=true;return;}
 videoURL=URL.createObjectURL(file);
 video.src=videoURL;
 video.hidden=false;
 video.onloadedmetadata=()=>{
  status('ভিডিও লোড হয়েছে। দৈর্ঘ্য: '+Math.floor(video.duration)+' সেকেন্ড।');
 };
});

function seek(time){
 return new Promise((resolve,reject)=>{
  if(Math.abs(video.currentTime-time)<0.05)return resolve();
  video.addEventListener('seeked',resolve,{once:true});
  video.addEventListener('error',()=>reject(Error('ভিডিও চালানো যায়নি।')),{once:true});
  video.currentTime=time;
 });
}

async function createClip(start,duration,index){
 await seek(start);
 const capture=video.captureStream||video.mozCaptureStream;
 if(!capture)throw Error('Chrome ব্রাউজারে আবার চেষ্টা করো।');
 if(!window.MediaRecorder)throw Error('এই ব্রাউজারে ভিডিও রেকর্ডিং সমর্থিত নয়।');

 const stream=capture.call(video);
 const types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
 const type=types.find(t=>MediaRecorder.isTypeSupported(t));
 if(!type)throw Error('সমর্থিত ভিডিও ফরম্যাট পাওয়া যায়নি।');

 return new Promise(async(resolve,reject)=>{
  let recorder,chunks=[],timer,finished=false;
  const stopTracks=()=>stream.getTracks().forEach(t=>t.stop());
  try{
   recorder=new MediaRecorder(stream,{mimeType:type});
   recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
   recorder.onerror=()=>{if(!finished){finished=true;clearTimeout(timer);stopTracks();reject(Error('রেকর্ডিং ব্যর্থ হয়েছে।'));}};
   recorder.onstop=()=>{
    clearTimeout(timer);video.pause();stopTracks();
    if(finished)return;
    finished=true;
    const blob=new Blob(chunks,{type});
    if(!blob.size)return reject(Error('খালি ক্লিপ তৈরি হয়েছে।'));
    resolve({blob,name:'short-'+(index+1)+'.webm'});
   };
   await video.play();
   recorder.start();
   timer=setTimeout(()=>{video.pause();if(recorder.state!=='inactive')recorder.stop();},duration*1000);
  }catch(e){
   clearTimeout(timer);stopTracks();reject(e);
  }
 });
}

function makeMetadata(topic,index){
 const clean=topic.trim()||'Cartoon Story';
 const words=clean.split(/\s+/).filter(Boolean);
 const tags=[...words,'Cartoon','Shorts','Animation','YouTubeShorts']
  .map(w=>'#'+w.replace(/[^\p{L}\p{N}_]/gu,''))
  .filter(t=>t.length>1);
 const unique=[...new Set(tags)].slice(0,8);
 return {
  title:clean+' | Short '+(index+1)+' #Shorts',
  hashtags:unique.join(' ')
 };
}

function addClipCard(clip,index,topic){
 const url=URL.createObjectURL(clip.blob);
 const data=makeMetadata(topic,index);
 const card=document.createElement('div');
 card.className='clip';

 const heading=document.createElement('h3');
 heading.textContent='ক্লিপ '+(index+1);
 const download=document.createElement('a');
 download.href=url;
 download.download=clip.name;
 download.textContent='⬇️ ভিডিও ডাউনলোড';

 const titleLabel=document.createElement('label');
 titleLabel.textContent='টাইটেল';
 const title=document.createElement('textarea');
 title.rows=2;
 title.value=data.title;

 const tagLabel=document.createElement('label');
 tagLabel.textContent='হ্যাশট্যাগ';
 const tags=document.createElement('textarea');
 tags.rows=2;
 tags.value=data.hashtags;

 const copy=document.createElement('button');
 copy.textContent='টাইটেল ও হ্যাশট্যাগ কপি';
 copy.onclick=async()=>{
  const text=title.value+'\n'+tags.value;
  try{
   await navigator.clipboard.writeText(text);
   copy.textContent='কপি হয়েছে ✓';
  }catch(e){
   title.focus();title.select();
   copy.textContent='টাইটেল নির্বাচন করা হয়েছে—কপি করো';
  }
 };

 card.append(heading,download,titleLabel,title,tagLabel,tags,copy);
 results.appendChild(card);
}

makeButton.addEventListener('click',async()=>{
 if(busy)return;

 if(!file){
  const link=document.getElementById('youtubeUrl').value.trim();
  if(link){
   status('YouTube লিংক দেওয়া হয়েছে, কিন্তু সরাসরি ক্লিপ তৈরি করতে সার্ভার ও অনুমোদিত ভিডিও অ্যাক্সেস যুক্ত করা বাকি।');
  }else{
   status('ফোন থেকে ভিডিও নির্বাচন করো অথবা YouTube লিংক পেস্ট করো।');
  }
  return;
 }

 const duration=Number(document.getElementById('duration').value);
 const count=Number(document.getElementById('count').value);
 const topic=document.getElementById('topic').value;

 if(!Number.isFinite(video.duration)||video.duration<duration){
  status('ভিডিওটি নির্বাচিত ক্লিপের চেয়ে ছোট অথবা এখনো লোড হয়নি।');
  return;
 }

 busy=true;makeButton.disabled=true;results.replaceChildren();

 try{
  const maxStart=video.duration-duration;
  for(let i=0;i<count;i++){
   const start=maxStart*(i/count);
   status('ক্লিপ তৈরি হচ্ছে: '+(i+1)+' / '+count);
   const clip=await createClip(start,duration,i);
   addClipCard(clip,i,topic);
  }
  status('সম্পন্ন! '+count+'টি ক্লিপ তৈরি হয়েছে। প্রতিটির ভিডিও, টাইটেল ও হ্যাশট্যাগ নিচে আছে।');
 }catch(e){
  status('সমস্যা: '+e.message);
 }finally{
  busy=false;makeButton.disabled=false;
 }
});
</script>
</body>
</html>
