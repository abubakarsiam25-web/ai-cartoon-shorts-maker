<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cartoon Shorts Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101322;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;background:#1b2037}
h1{font-size:24px;color:#a8b2ff}
main{max-width:720px;margin:auto;padding:15px}
.card{background:#1b2037;padding:17px;border-radius:13px;margin-bottom:16px}
label{display:block;margin:13px 0 7px}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #485071;background:#101629;color:white}
button{border:0;border-radius:8px;padding:13px;background:#6878ff;color:white;font-weight:bold;margin-top:12px;width:100%;font-size:15px}
button:disabled{opacity:.5}
.note{font-size:13px;color:#c8cce1;line-height:1.6}
video{width:100%;margin-top:12px;background:#000;border-radius:8px}
#status{white-space:pre-wrap;padding:12px;background:#101629;border-radius:8px;margin-top:12px;line-height:1.6}
.clip{background:#101629;padding:12px;border-radius:9px;margin-top:12px;overflow-wrap:anywhere}
.clip a{color:#b6c0ff;display:inline-block;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>🎬 Cartoon Shorts Maker</h1>
<p>16:9 ভিডিও • HD ক্লিপ • টাইটেল ও হ্যাশট্যাগ</p>
</header>

<main>
<section class="card">
<h2>ভিডিও নির্বাচন</h2>
<label>ফোন থেকে ভিডিও আপলোড</label>
<input type="file" id="videoFile" accept="video/*">
<video id="preview" controls playsinline hidden></video>

<label>YouTube ভিডিও লিংক</label>
<input type="url" id="youtubeUrl" placeholder="YouTube লিংক পেস্ট করো">
<p class="note">এই সংস্করণে YouTube লিংক থেকে সরাসরি ভিডিও প্রসেস করার সার্ভার এখনও যুক্ত নেই।</p>

<label>ক্লিপের দৈর্ঘ্য</label>
<select id="duration">
<option value="8">৮ সেকেন্ড</option>
<option value="10" selected>১০ সেকেন্ড</option>
<option value="15">১৫ সেকেন্ড</option>
</select>

<label>ভিডিও রেজুলেশন (16:9)</label>
<select id="resolution">
<option value="480">854 × 480 — 480p</option>
<option value="720" selected>1280 × 720 — 720p</option>
<option value="1080">1920 × 1080 — 1080p</option>
</select>

<label>ক্লিপের সংখ্যা</label>
<select id="count">
<option value="3">৩টি ক্লিপ</option>
<option value="5">৫টি ক্লিপ</option>
<option value="7">৭টি ক্লিপ</option>
<option value="10" selected>১০টি ক্লিপ</option>
</select>

<label>ভিডিওর বিষয়</label>
<input id="topic" placeholder="যেমন: Funny Cartoon, Cat Story">

<button id="make">✂️ ক্লিপ তৈরি করো</button>
<div id="status">প্রথমে ভিডিও নির্বাচন করো।</div>
<div id="results"></div>
</section>
</main>

<script>
const fileInput=document.getElementById('videoFile');
const video=document.getElementById('preview');
const statusBox=document.getElementById('status');
const results=document.getElementById('results');
const makeButton=document.getElementById('make');

let file=null, videoURL=null, busy=false;
let downloadURLs=[];

function setStatus(t){statusBox.textContent=t}

function clearResults(){
 results.replaceChildren();
 downloadURLs.forEach(u=>URL.revokeObjectURL(u));
 downloadURLs=[];
}

fileInput.addEventListener('change',()=>{
 file=fileInput.files[0];
 clearResults();
 if(videoURL)URL.revokeObjectURL(videoURL);
 videoURL=null;

 if(!file){
  video.hidden=true;
  setStatus('ভিডিও নির্বাচন করো।');
  return;
 }

 videoURL=URL.createObjectURL(file);
 video.src=videoURL;
 video.hidden=false;

 video.onloadedmetadata=()=>{
  setStatus(
   'ভিডিও লোড হয়েছে।\nমূল রেজুলেশন: '+
   video.videoWidth+' × '+video.videoHeight+
   '\nদৈর্ঘ্য: '+Math.floor(video.duration)+' সেকেন্ড'
  );
 };
});

function seekTo(time){
 return new Promise((resolve,reject)=>{
  if(Math.abs(video.currentTime-time)<0.04){
   resolve();return;
  }
  const cleanup=()=>{
   video.removeEventListener('seeked',onSeeked);
   video.removeEventListener('error',onError);
  };
  const onSeeked=()=>{cleanup();resolve()};
  const onError=()=>{cleanup();reject(Error('ভিডিও লোড হয়নি।'))};
  video.addEventListener('seeked',onSeeked);
  video.addEventListener('error',onError);
  video.currentTime=time;
 });
}

function recordClip(start,duration,index){
 return new Promise(async(resolve,reject)=>{
  let recorder=null,timer=null,finished=false;
  let chunks=[];

  const stopTracks=stream=>{
   if(stream)stream.getTracks().forEach(t=>{
    try{t.stop()}catch(e){}
   });
  };

  try{
   await seekTo(start);

   const capture=video.captureStream||video.mozCaptureStream;
   if(!capture||!window.MediaRecorder){
    throw Error('এই ব্রাউজার ভিডিও রেকর্ডিং সমর্থন করছে না। Chrome-এ চেষ্টা করো।');
   }

   const stream=capture.call(video);
   const types=[
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
   ];
   const mimeType=types.find(t=>MediaRecorder.isTypeSupported(t));

   if(!mimeType){
    stopTracks(stream);
    throw Error('সমর্থিত ভিডিও ফরম্যাট পাওয়া যায়নি।');
   }

   const recorderOptions={mimeType};
   recorderOptions.videoBitsPerSecond=8000000;
   recorder=new MediaRecorder(stream,recorderOptions);

   const fail=error=>{
    if(finished)return;
    finished=true;
    clearTimeout(timer);
    video.pause();
    if(recorder&&recorder.state!=='inactive'){
     try{recorder.stop()}catch(e){}
    }
    stopTracks(stream);
    reject(error);
   };

   recorder.ondataavailable=e=>{
    if(e.data&&e.data.size>0)chunks.push(e.data);
   };

   recorder.onerror=()=>fail(Error('ভিডিও রেকর্ডিংয়ে সমস্যা হয়েছে।'));

   recorder.onstop=()=>{
    clearTimeout(timer);
    video.pause();
    stopTracks(stream);

    if(finished)return;
    finished=true;

    const blob=new Blob(chunks,{type:mimeType});
    if(!blob.size){
     reject(Error('ভিডিও খালি হয়েছে। আবার চেষ্টা করো।'));
     return;
    }
    resolve({blob,name:'short-'+(index+1)+'.webm'});
   };

   video.muted=false;
   await video.play();
   recorder.start(250);

   timer=setTimeout(()=>{
    video.pause();
    if(recorder.state!=='inactive')recorder.stop();
   },duration*1000);

  }catch(e){
   clearTimeout(timer);
   if(recorder&&recorder.state!=='inactive'){
    try{recorder.stop()}catch(_){}
   }
   reject(e);
  }
 });
}

function metadata(topic,index){
 const subject=topic.trim()||'Cartoon Story';
 const tags=[...new Set([
  ...subject.split(/\s+/),
  'Cartoon','Shorts','Animation','YouTubeShorts'
 ].map(w=>'#'+w.replace(/[^\p{L}\p{N}_]/gu,''))
 .filter(w=>w.length>1))].slice(0,8);

 return {
  title:subject+' | Short '+(index+1)+' #Shorts',
  hashtags:tags.join(' ')
 };
}

function addClip(clip,index,topic,resolution){
 const url=URL.createObjectURL(clip.blob);
 downloadURLs.push(url);

 const card=document.createElement('div');
 card.className='clip';

 const heading=document.createElement('h3');
 heading.textContent='ক্লিপ '+(index+1)+' • '+resolution+'p';

 const player=document.createElement('video');
 player.controls=true;
 player.playsInline=true;
 player.preload='metadata';
 player.src=url;

 const link=document.createElement('a');
 link.href=url;
 link.download=clip.name;
 link.textContent='⬇️ ভিডিও ডাউনলোড';

 const titleLabel=document.createElement('label');
 titleLabel.textContent='টাইটেল';

 const title=document.createElement('textarea');
 title.rows=2;
 title.value=metadata(topic,index).title;

 const tagsLabel=document.createElement('label');
 tagsLabel.textContent='হ্যাশট্যাগ';

 const tags=document.createElement('textarea');
 tags.rows=2;
 tags.value=metadata(topic,index).hashtags;

 const copy=document.createElement('button');
 copy.textContent='টাইটেল ও হ্যাশট্যাগ কপি';
 copy.onclick=async()=>{
  try{
   await navigator.clipboard.writeText(title.value+'\n'+tags.value);
   copy.textContent='কপি হয়েছে ✓';
  }catch(e){
   title.focus();title.select();
   copy.textContent='টাইটেল নির্বাচন করা হয়েছে—কপি করো';
  }
 };

 card.append(heading,player,link,titleLabel,title,tagsLabel,tags,copy);
 results.appendChild(card);
}

makeButton.addEventListener('click',async()=>{
 if(busy)return;

 if(!file||!videoURL||!Number.isFinite(video.duration)){
  const link=document.getElementById('youtubeUrl').value.trim();
  setStatus(link
   ?'YouTube লিংক দেওয়া হয়েছে, কিন্তু সরাসরি প্রসেস করার সার্ভার এখনও যুক্ত নেই।'
   :'আগে ফোন থেকে একটি ভিডিও নির্বাচন করো।'
  );
  return;
 }

 const duration=Number(document.getElementById('duration').value);
 const count=Number(document.getElementById('count').value);
 const resolution=Number(document.getElementById('resolution').value);
 const topic=document.getElementById('topic').value;

 if(video.duration<duration){
  setStatus('ভিডিওটি নির্বাচিত ক্লিপের চেয়ে ছোট।');
  return;
 }

 busy=true;
 makeButton.disabled=true;
 clearResults();

 try{
  const maxStart=video.duration-duration;
  const starts=[];

  for(let i=0;i<count;i++){
   starts.push(maxStart*(i/count));
  }

  for(let i=starts.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [starts[i],starts[j]]=[starts[j],starts[i]];
  }

  for(let i=0;i<count;i++){
   setStatus('ক্লিপ তৈরি হচ্ছে '+(i+1)+' / '+count+
    '\nনির্বাচিত আউটপুট: '+resolution+'p, 16:9'+
    '\nপেজ খোলা রাখো।');

   const clip=await recordClip(starts[i],duration,i);
   addClip(clip,i,topic,resolution);
  }

  setStatus('সব ক্লিপ তৈরি হয়েছে। ডাউনলোড করে পরীক্ষা করো।');
 }catch(e){
  setStatus('সমস্যা: '+e.message);
 }finally{
  busy=false;
  makeButton.disabled=false;
 }
});
</script>
</body>
</html>
