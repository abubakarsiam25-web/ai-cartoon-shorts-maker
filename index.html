<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartoon Shorts Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101322;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:22px;background:#1b2037}
h1{font-size:24px;color:#a8b2ff}
main{max-width:720px;margin:auto;padding:15px}
.card{background:#1b2037;padding:17px;border-radius:13px;margin-bottom:16px}
label{display:block;margin:13px 0 7px}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #485071;background:#101629;color:white}
button{border:0;border-radius:8px;padding:13px;background:#6878ff;color:white;font-weight:bold;margin-top:12px;width:100%;font-size:15px}
button:disabled{opacity:.5}
.note{font-size:13px;color:#c8cce1;line-height:1.6}
video{width:100%;margin-top:12px;background:#000;border-radius:8px}
#status{white-space:pre-wrap;padding:12px;background:#101629;border-radius:8px;margin-top:12px;line-height:1.6;overflow-wrap:anywhere}
.clip{background:#101629;padding:12px;border-radius:9px;margin-top:12px;overflow-wrap:anywhere}
.clip a{color:#b6c0ff;display:inline-block;margin-top:10px}
</style>
</head>
<body>
<header>
<h1>🎬 Cartoon Shorts Maker</h1>
<p>MP4 • 16:9 • HD Shorts</p>
</header>

<main>
<section class="card">
<h2>ভিডিও থেকে ক্লিপ তৈরি</h2>

<label>ফোন থেকে ভিডিও নির্বাচন করো</label>
<input type="file" id="videoFile" accept="video/*">
<video id="preview" controls playsinline hidden></video>

<label>YouTube ভিডিও লিংক</label>
<input type="url" id="youtubeUrl" placeholder="YouTube লিংক পেস্ট করো">
<p class="note">
YouTube লিংক থেকে সরাসরি প্রসেসিংয়ের সার্ভার এখনও যুক্ত নেই।
আপাতত নিজের বা ব্যবহারের অনুমতি থাকা ভিডিও ফাইল আপলোড করো।
</p>

<label>প্রতিটি ক্লিপের দৈর্ঘ্য</label>
<select id="duration">
<option value="8">৮ সেকেন্ড</option>
<option value="10" selected>১০ সেকেন্ড</option>
<option value="15">১৫ সেকেন্ড</option>
</select>

<label>ভিডিও রেজুলেশন — 16:9</label>
<select id="resolution">
<option value="480">480p — 854 × 480</option>
<option value="720" selected>720p — 1280 × 720</option>
<option value="1080">1080p — 1920 × 1080</option>
</select>

<label>কতটি ক্লিপ?</label>
<select id="count">
<option value="3">৩টি ক্লিপ</option>
<option value="5">৫টি ক্লিপ</option>
<option value="7">৭টি ক্লিপ</option>
<option value="10" selected>১০টি ক্লিপ</option>
</select>

<label>ভিডিওর বিষয় / কীওয়ার্ড</label>
<input id="topic" placeholder="যেমন: Funny Cartoon, Cat Story">

<button id="loadEngine">১. ভিডিও প্রসেসিং ইঞ্জিন চালু করো</button>
<button id="make" disabled>২. ক্লিপ তৈরি করো</button>

<div id="status">প্রথমে ভিডিও নির্বাচন করো। ইঞ্জিন প্রথমবার চালু করতে ইন্টারনেট লাগবে।</div>
<div id="results"></div>
</section>
</main>

<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
const fileInput = document.getElementById("videoFile");
const video = document.getElementById("preview");
const statusBox = document.getElementById("status");
const results = document.getElementById("results");
const loadButton = document.getElementById("loadEngine");
const makeButton = document.getElementById("make");

let selectedFile = null;
let previewURL = null;
let ffmpeg = null;
let engineReady = false;
let busy = false;
let downloadURLs = [];

function setStatus(message) {
  statusBox.textContent = message;
}

function clearResults() {
  results.replaceChildren();
  downloadURLs.forEach(url => URL.revokeObjectURL(url));
  downloadURLs = [];
}

fileInput.addEventListener("change", () => {
  selectedFile = fileInput.files && fileInput.files[0];
  clearResults();

  if (previewURL) URL.revokeObjectURL(previewURL);
  previewURL = null;

  if (!selectedFile) {
    video.hidden = true;
    setStatus("ভিডিও নির্বাচন করো।");
    return;
  }

  previewURL = URL.createObjectURL(selectedFile);
  video.src = previewURL;
  video.hidden = false;

  video.onloadedmetadata = () => {
    setStatus(
      "ভিডিও লোড হয়েছে।\nআসল রেজুলেশন: " +
      video.videoWidth + " × " + video.videoHeight +
      "\nদৈর্ঘ্য: " + Math.floor(video.duration) + " সেকেন্ড।"
    );
  };
});

loadButton.addEventListener("click", async () => {
  if (engineReady || busy) return;

  loadButton.disabled = true;
  setStatus("ভিডিও প্রসেসিং ইঞ্জিন ডাউনলোড হচ্ছে। প্রথমবার প্রায় ৩০ MB বা তার বেশি ডেটা লাগতে পারে।");

  try {
    if (typeof FFmpeg === "undefined") {
      throw new Error("FFmpeg লাইব্রেরি লোড হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করে পেজ রিফ্রেশ করো।");
    }

    const { createFFmpeg } = FFmpeg;

    ffmpeg = createFFmpeg({
      log: false,
      corePath: "https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js",
      progress: ({ ratio }) => {
        if (Number.isFinite(ratio)) {
          setStatus("ভিডিও প্রসেস হচ্ছে: " +
            Math.min(100, Math.max(0, Math.round(ratio * 100))) + "%");
        }
      }
    });

    await ffmpeg.load();

    engineReady = true;
    makeButton.disabled = false;
    loadButton.textContent = "ইঞ্জিন চালু হয়েছে ✓";
    setStatus("ইঞ্জিন প্রস্তুত। এখন ভিডিও নির্বাচন করে ক্লিপ তৈরি করো।");
  } catch (error) {
    loadButton.disabled = false;
    setStatus("ইঞ্জিন চালু হয়নি:\n" + (error.message || error) +
      "\nChrome-এ চেষ্টা করো এবং ইন্টারনেট সংযোগ পরীক্ষা করো।");
  }
});

function getExtension(name) {
  const ext = (name.split(".").pop() || "").toLowerCase();
  const allowed = ["mp4", "mov", "m4v", "webm", "avi", "mkv", "3gp"];
  return allowed.includes(ext) ? ext : "mp4";
}

function makeMetadata(topic, index) {
  const subject = topic.trim() || "Cartoon Story";
  const tags = [...new Set(
    [...subject.split(/\s+/), "Cartoon", "Shorts", "Animation", "YouTubeShorts"]
      .map(word => "#" + word.replace(/[^\p{L}\p{N}_]/gu, ""))
      .filter(tag => tag.length > 1)
  )].slice(0, 8);

  return {
    title: subject + " | Short " + (index + 1) + " #Shorts",
    hashtags: tags.join(" ")
  };
}

function addClip(clip, index, topic, resolution) {
  const url = URL.createObjectURL(clip);
  downloadURLs.push(url);

  const card = document.createElement("div");
  card.className = "clip";

  const heading = document.createElement("h3");
  heading.textContent = "ক্লিপ " + (index + 1) + " • " + resolution + "p";

  const player = document.createElement("video");
  player.controls = true;
  player.playsInline = true;
  player.preload = "metadata";
  player.src = url;

  const download = document.createElement("a");
  download.href = url;
  download.download = "cartoon-short-" + (index + 1) + ".mp4";
  download.textContent = "⬇️ MP4 ভিডিও ডাউনলোড";

  const titleLabel = document.createElement("label");
  titleLabel.textContent = "টাইটেল";

  const title = document.createElement("textarea");
  title.rows = 2;
  title.value = makeMetadata(topic, index).title;

  const tagsLabel = document.createElement("label");
  tagsLabel.textContent = "হ্যাশট্যাগ";

  const tags = document.createElement("textarea");
  tags.rows = 2;
  tags.value = makeMetadata(topic, index).hashtags;

  const copy = document.createElement("button");
  copy.textContent = "টাইটেল ও হ্যাশট্যাগ কপি";

  copy.onclick = async () => {
    try {
      await navigator.clipboard.writeText(title.value + "\n" + tags.value);
      copy.textContent = "কপি হয়েছে ✓";
    } catch (_) {
      title.focus();
      title.select();
      copy.textContent = "টাইটেল নির্বাচন করা হয়েছে—কপি করো";
    }
  };

  card.append(heading, player, download, titleLabel, title, tagsLabel, tags, copy);
  results.appendChild(card);
}

makeButton.addEventListener("click", async () => {
  if (busy) return;

  if (!selectedFile || !previewURL || !Number.isFinite(video.duration)) {
    const link = document.getElementById("youtubeUrl").value.trim();
    setStatus(link
      ? "YouTube লিংক দেওয়া হয়েছে, কিন্তু সরাসরি লিংক প্রসেস করার সার্ভার এখনও যুক্ত নেই।"
      : "আগে ফোন থেকে একটি ভিডিও নির্বাচন করো।");
    return;
  }

  if (!engineReady || !ffmpeg) {
    setStatus("আগে ভিডিও প্রসেসিং ইঞ্জিন চালু করো।");
    return;
  }

  const duration = Number(document.getElementById("duration").value);
  const count = Number(document.getElementById("count").value);
  const resolution = Number(document.getElementById("resolution").value);
  const topic = document.getElementById("topic").value;

  if (video.duration < duration) {
    setStatus("ভিডিওটি নির্বাচিত ক্লিপের চেয়ে ছোট।");
    return;
  }

  const dimensions = {
    480: [854, 480],
    720: [1280, 720],
    1080: [1920, 1080]
  };

  const [width, height] = dimensions[resolution];
  const inputName = "input." + getExtension(selectedFile.name);
  const outputNames = [];

  busy = true;
  makeButton.disabled = true;
  loadButton.disabled = true;
  clearResults();

  try {
    setStatus("ভিডিও মেমোরিতে লোড হচ্ছে। বড় ভিডিও হলে সময় লাগতে পারে।");

    const inputData = new Uint8Array(await selectedFile.arrayBuffer());
    ffmpeg.FS("writeFile", inputName, inputData);

    const maxStart = Math.max(0, video.duration - duration);
    const starts = [];

    for (let i = 0; i < count; i++) {
      starts.push(maxStart * i / count);
    }

    for (let i = starts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [starts[i], starts[j]] = [starts[j], starts[i]];
    }

    for (let i = 0; i < count; i++) {
      const outputName = "clip_" + i + ".mp4";
      outputNames.push(outputName);

      setStatus(
        "ক্লিপ তৈরি হচ্ছে: " + (i + 1) + " / " + count +
        "\nআউটপুট: " + width + " × " + height +
        "\nদৈর্ঘ্য: " + duration + " সেকেন্ড।"
      );

      const start = starts[i].toFixed(3);

      await ffmpeg.run(
        "-ss", start,
        "-i", inputName,
        "-t", String(duration),
        "-map", "0:v:0",
        "-map", "0:a?",
        "-vf",
        "scale=" + width + ":" + height +
          ":force_original_aspect_ratio=increase," +
          "crop=" + width + ":" + height +
          ",setsar=1,fps=30",
        "-c:v", "libx264",
        "-preset", "ultrafast",
        "-crf", "23",
        "-pix_fmt", "yuv420p",
        "-c:a", "aac",
        "-b:a", "128k",
        "-ar", "44100",
        "-ac", "2",
        "-movflags", "+faststart",
        outputName
      );

      const outputData = ffmpeg.FS("readFile", outputName);
      const clipBlob = new Blob([outputData], { type: "video/mp4" });

      if (!clipBlob.size) {
        throw new Error("ক্লিপ " + (i + 1) + " খালি তৈরি হয়েছে।");
      }

      addClip(clipBlob, i, topic, resolution);

      try {
        ffmpeg.FS("unlink", outputName);
      } catch (_) {}
    }

    try {
      ffmpeg.FS("unlink", inputName);
    } catch (_) {}

    setStatus(
      "সম্পন্ন! " + count + "টি MP4 ক্লিপ তৈরি হয়েছে।" +
      "\nঅনুপাত: 16:9" +
      "\nরেজুলেশন: " + width + " × " + height +
      "\nপ্রতিটি ক্লিপের ডাউনলোড বাটনে চাপ দাও।"
    );

  } catch (error) {
    setStatus(
      "ভিডিও প্রসেস করা যায়নি:\n" + (error.message || error) +
      "\nকম রেজুলেশন বা ছোট ভিডিও দিয়ে আবার চেষ্টা করো।"
    );

    try {
      ffmpeg.FS("unlink", inputName);
    } catch (_) {}
  } finally {
    busy = false;
    makeButton.disabled = !engineReady;
    loadButton.disabled = engineReady;
  }
});
</script>
</body>
</html>
